[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "aios"
version = "0.1.0"
description = "Multi-agent AI orchestration system with Obsidian as shared memory"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "pyyaml",
    "click",
    "rich",
]

[project.scripts]
aios = "aios.cli:main"

[tool.setuptools.packages.find]
where = ["src"]